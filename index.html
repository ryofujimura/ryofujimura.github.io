<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Panorama Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Button -->
    <div class="auth-container">
        <button id="authButton" class="auth-button">Login</button>
    </div>

    <!-- 360 Panorama Viewer -->
    <div id="panorama"></div>
    <!-- Three.js Overlay for 3D Objects -->
    <canvas id="threejs-overlay"></canvas>

    <!-- Auth Popup Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Login</h2>
            
            <div id="loginForm" class="auth-form">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button id="loginSubmit" class="submit-button">Login</button>
                <p class="switch-auth">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>
            </div>

            <div id="signupForm" class="auth-form" style="display: none;">
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <input type="password" id="signupPasswordConfirm" placeholder="Confirm Password" required>
                <button id="signupSubmit" class="submit-button">Sign Up</button>
                <p class="switch-auth">Already have an account? <a href="#" id="switchToLogin">Login</a></p>
            </div>

            <div id="authError" class="error-message"></div>
        </div>
    </div>

    <!-- Object Popup Modal -->
    <div id="objectModal" class="modal">
        <div class="modal-content">
            <span class="close-object">&times;</span>
            <h2 id="objectTitle">Bose SoundLink Handle</h2>
            <div id="objectContent">
                <p>This is a 3D model of the Bose SoundLink Handle.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- Three.js ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="threejs-loader.js"></script>
    <!-- Pannellum -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
